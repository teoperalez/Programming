[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-band-composer"
version = "0.0.1"
description = "Local AI tool that builds a full band arrangement around a vocal + guitar recording."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }

# Versions pinned to known-good ranges as of May 2026.
# Some packages (magenta, ACE-Step) are pulled directly from git in the
# v0.1+ phases — see comments in the relevant src/compose/*.py modules
# for the exact install commands once those phases land.
dependencies = [
    "gradio>=4.40,<5",
    "numpy>=1.26,<2",
    "scipy>=1.13",
    "soundfile>=0.12",
    "librosa>=0.10.2",
    "pydub>=0.25",
    "pyloudnorm>=0.1.1",
    "pretty_midi>=0.2.10",
    "mido>=1.3",
    "pydantic>=2.7",
]

[project.optional-dependencies]
# Heavy ML deps — install once the v0.1+ phases need them.
analyze = [
    "demucs>=4.0",
    "madmom>=0.16.1",
    "basic-pitch>=0.3",
    "faster-whisper>=1.0",
    "ollama>=0.2",
]
compose = [
    # "magenta @ git+https://github.com/magenta/magenta.git",   # phase v0.1
    # "acestep @ git+https://github.com/ace-step/ACE-Step.git", # phase v0.4
    "torch>=2.2",
    "torchaudio>=2.2",
    "pyfluidsynth>=1.3.3",
    "pyrubberband>=0.4",
]
desktop = [
    "pywebview>=5",
]
dev = [
    "pytest>=8",
    "pytest-mock>=3.12",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
ai-band-composer = "app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: tests that require a CUDA GPU and downloaded model weights",
]
